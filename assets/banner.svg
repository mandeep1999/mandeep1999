<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Mandeep Singh  Android Platform and UI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a0c"/>
      <stop offset="48%" stop-color="#0a171c"/>
      <stop offset="100%" stop-color="#10262e"/>
    </linearGradient>
    <radialGradient id="glowL" cx="12%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#4be0cf" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4be0cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="92%" cy="18%" r="48%">
      <stop offset="0%" stop-color="#185a6e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#185a6e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1aa897"/>
      <stop offset="100%" stop-color="#4be0cf"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a383e"/>
      <stop offset="32%" stop-color="#152429"/>
      <stop offset="100%" stop-color="#081114"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#glowL)"/>
  <rect width="1280" height="420" fill="url(#glowR)"/>

  <!-- faint grid -->
  <g stroke="#f2f7f8" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 70 H1280 M0 140 H1280 M0 210 H1280 M0 280 H1280 M0 350 H1280"/>
    <path d="M80 0 V420 M160 0 V420 M240 0 V420 M320 0 V420 M400 0 V420 M480 0 V420 M560 0 V420 M640 0 V420 M720 0 V420 M800 0 V420 M880 0 V420 M960 0 V420 M1040 0 V420 M1120 0 V420 M1200 0 V420"/>
  </g>

  <!-- phone -->
  <g transform="translate(980,46)">
    <rect x="8" y="16" width="196" height="392" rx="44" fill="#031015" opacity="0.45"/>
    <rect width="196" height="328" rx="42" fill="url(#phone)" stroke="#1a3a42" stroke-width="1.5"/>
    <rect x="10" y="10" width="176" height="308" rx="32" fill="#081015"/>
    <rect x="62" y="18" width="72" height="12" rx="6" fill="#010405"/>
    <circle cx="122" cy="24" r="3.2" fill="#3d5a66"/>
    <text x="98" y="128" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#4be0cf">Platforms &amp; UI</text>
    <text x="98" y="154" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8aa3aa">Walmart Global Tech</text>
    <rect x="58" y="292" width="80" height="4" rx="2" fill="#c8dcde" fill-opacity="0.28"/>
  </g>

  <text x="72" y="118" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" letter-spacing="4.2" fill="#4be0cf">SOFTWARE ENGINEER  3</text>
  <text x="72" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#f2f7f8">Mandeep Singh</text>
  <rect x="72" y="214" width="92" height="3" rx="2" fill="url(#accent)"/>
  <text x="72" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#8aa3aa">Android Platform &amp; UI Engineer</text>
  <text x="72" y="312" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#f2f7f8" fill-opacity="0.82">I build Android platforms people ship on. · Bengaluru</text>
</svg>
